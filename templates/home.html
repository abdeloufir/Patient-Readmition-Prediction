<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Patient Readmission • New Prediction</title>

    <!-- Bootstrap 5 (CSS) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />

    <!-- Custom styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <!-- HERO -->
    <section class="hero py-5 mb-4">
      <div class="container">
        <h1 class="display-6 fw-bold text-white mb-2">Patient Readmission – New Prediction</h1>
      </div>
    </section>

    <div class="container pb-5">
      <div class="row justify-content-center">
        <div class="col-xl-8 col-lg-9">
          <div class="card p-4">
            <div class="card-body">
              <h5 class="card-title mb-3">Patient Details</h5>

              <!-- IMPORTANT: posts to your '/predict' endpoint -->
              <form method="POST" action="{{ url_for('predict') }}">
                <div class="row g-3">
                  <!-- INT features your /predict reads -->
                  <div class="col-md-4">
                    <label class="form-label" for="mb_readmitted_gt30_ct">Count of hospital readmissions occurring &gt;30 days after the prior discharge.</label>
                    <input type="number" id="mb_readmitted_gt30_ct" name="mb_readmitted_gt30_ct" class="form-control" min="0" step="1" required />
                  </div>

                  <div class="col-md-4">
                    <label class="form-label" for="mb_readmitted_lt30_ct">Count of hospital readmissions occurring &lt;30 days after the prior discharge.</label>
                    <input type="number" id="mb_readmitted_lt30_ct" name="mb_readmitted_lt30_ct" class="form-control" min="0" step="1" required />
                  </div>

                  <div class="col-md-4">
                    <label class="form-label" for="mb_readmitted_no_ct">Number of times the patient was admitted but was not readmitted afterward.</label>
                    <input type="number" id="mb_readmitted_no_ct" name="mb_readmitted_no_ct" class="form-control" min="0" step="1" required />
                  </div>

                  <div class="col-md-4">
                    <label class="form-label" for="distinct_diag_count">Number of unique diagnosis a patient has ever had</label>
                    <input type="number" id="distinct_diag_count" name="distinct_diag_count" class="form-control" min="0" step="1" required />
                  </div>

                  <div class="col-md-4">
                    <label class="form-label" for="encounter_ct">Total number of hospital admissions for the patient</label>
                    <input type="number" id="encounter_ct" name="encounter_ct" class="form-control" min="0" step="1" required />
                  </div>

                  <div class="col-md-4">
                    <label class="form-label" for="number_inpatient">Number of inpatient visits in the 12 months prior to the current encounter</label>
                    <input type="number" id="number_inpatient" name="number_inpatient" class="form-control" min="0" step="1" required />
                  </div>

                  <div class="col-md-6">
                    <label class="form-label" for="mb_number_inpatient_ct">How many times did that happen</label>
                    <input type="number" id="mb_number_inpatient_ct" name="mb_number_inpatient_ct" class="form-control" min="0" step="1" required />
                  </div>

                  <div class="col-md-6">
                    <label class="form-label" for="mb_number_diagnoses_ct">Total number of patient's diagnosis</label>
                    <input type="number" id="mb_number_diagnoses_ct" name="mb_number_diagnoses_ct" class="form-control" min="0" step="1" required />
                  </div>

                  <!-- CATEGORICAL features your /predict reads -->
                  <div class="col-md-6">
                    <label class="form-label" for="admission_type">Admission Type</label>
                    <select id="admission_type" name="admission_type" class="form-select" required>
                      <option value="" selected disabled>Select admission type…</option>
                      <option value="1">1 – Emergency</option>
                      <option value="2">2 – Urgent</option>
                      <option value="3">3 – Elective</option>
                      <option value="4">4 – Newborn</option>
                      <option value="5">5 – Not Available</option>
                      <option value="6">6 – NULL/Unknown</option>
                      <option value="7">7 – Trauma Center</option>
                      <option value="8">8 – Not Mapped</option>
                    </select>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label" for="A1Cresult">A1C Result (Avg Blood Gluose)</label>
                    <select id="A1Cresult" name="A1Cresult" class="form-select" required>
                      <option value="" selected disabled>Select A1C…</option>
                      <option value="None">None</option>
                      <option value="Norm">Norm</option>
                      <option value=">7">&gt;7</option>
                      <option value=">8">&gt;8</option>
                    </select>
                  </div>
                </div>

                <div class="d-flex align-items-center gap-3 mt-4">
                  <button type="submit" class="btn btn-success px-4">Predict</button>
                  <a class="btn btn-outline-secondary" href="{{ url_for('home') }}">Reset</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5 (JS) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <h2>The prediction is {{ results }}</h2>
  </body>
</html>
